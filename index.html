:root{--t:#fff;--m:#A3A3A3;--ye:#FFC400;--cy:#29C5F6;--pu:#A64CFF;--rd:#F0483E;--pk:#F0509F;--gr:#9BE22B;--game:"Krunker",Impact,"Arial Narrow",sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(#2a2623,#161412 70%);color:var(--t);font:1.2rem/1.7 var(--game);letter-spacing:.02em}
html{zoom:.66}
a{color:inherit;text-decoration:none}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.hud{display:inline-flex;margin:14px 0 0 14px;background:#080b26;border-radius:8px;box-shadow:0 4px 0 rgba(0,0,0,.45);overflow:hidden}
.hud b{font-weight:400;font-size:1.9rem;line-height:1.5;padding:10px 20px}
.hud span{background:#020207;color:var(--m);font-size:1.3rem;padding:12px 22px;text-transform:uppercase}
.hero{text-align:center;padding:56px 20px 30px}
h1{margin:0;font-weight:400;text-transform:uppercase;line-height:1.5;font-size:clamp(3rem,9vw,6rem);-webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:0 7px 0 #000}
.hero p{max-width:30em;margin:14px auto 0;color:#E8E8E8}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:30px 0 140px}
.card{display:block;background:#1b1b1b;border-top:5px solid var(--c);border-radius:14px;padding:24px;transition:transform .12s ease,background .12s ease}
.card:hover{transform:translateY(-8px) rotate(-1.5deg);background:#262626}
.card:active{transform:translateY(1px) scale(.98)}
.card h2{margin:0 0 10px;font-weight:400;font-size:2.2rem;line-height:1.5;color:var(--c);text-transform:uppercase}
.card p{margin:0 0 16px;color:#EDEDED}
.tagpill{display:inline-block;background:var(--c);color:#000;border-radius:10px;padding:0 12px;font-size:1.1rem;line-height:1.8}
.soon{opacity:.85}
@media(max-width:760px){.menu{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
